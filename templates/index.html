<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRG AI - Your Smart Assistant</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #252538;
            background: linear-gradient(135deg, #fff8e9, #ffe8d1);
        }

        header {
            text-align: center;
            padding: 35px 15px 20px;
        }

        .logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        h1 {
            margin: 15px 0;
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 800;
            background: linear-gradient(90deg, #df1764, #ff7900);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        header p {
            color: #626274;
            font-size: 18px;
        }

        main {
            width: min(950px, 92%);
            margin: 20px auto 35px;
            padding: 25px;
            background: white;
            border: 1px solid #ffdfb0;
            border-radius: 26px;
            box-shadow: 0 15px 45px #b57c3020;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        #question {
            flex: 1 1 300px;
            min-width: 0;
            padding: 17px;
            border: 2px solid #e60070;
            border-radius: 17px;
            font-size: 17px;
            outline-offset: 3px;
        }

        button {
            border: 0;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform .15s, opacity .15s;
        }

        button:hover { transform: translateY(-1px); }
        button:disabled { opacity: .6; cursor: wait; }

        .ask {
            color: white;
            background: linear-gradient(100deg, #d00069, #ff8500);
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .tool {
            color: #a50050;
            background: #fff0f6;
            border: 1px solid #ffd0e4;
        }

        .tool.active {
            color: white;
            background: #c90063;
        }

        #status {
            min-height: 24px;
            margin-top: 15px;
            color: #656579;
            font-size: 14px;
        }

        .card {
            margin-top: 22px;
            padding: 23px;
            background: #fff;
            border: 1px solid #eee;
            border-left: 6px solid #d00069;
            border-radius: 16px;
            box-shadow: 0 8px 25px #00000008;
        }

        .card.question-card {
            background: #fff4df;
            border-left-color: #ff9700;
        }

        .label {
            margin-bottom: 8px;
            color: #a36a00;
            font-weight: bold;
            font-size: 13px;
        }

        .answer-title {
            margin-bottom: 16px;
            color: #d00069;
            font-size: 20px;
            font-weight: bold;
        }

        #answer {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.7;
            font-size: 17px;
        }

        footer {
            padding: 10px 15px 30px;
            text-align: center;
            color: #888;
        }

        footer strong { color: #d00069; }

        @media (max-width: 600px) {
            header { padding-top: 25px; }
            main { padding: 17px; }
            form { flex-direction: column; }
            #question, .ask { width: 100%; }
            .tools button { flex: 1 1 auto; }
        }
    </style>
</head>
<body>
    <header>
        <img
            class="logo"
            src="{{ url_for('static', filename='mrg-ai-logo.png') }}"
            alt="MRG AI Logo"
            onerror="this.style.display='none'"
        >
        <h1>Welcome to MRG AI</h1>
        <p>Ask anything. Learn anything. Discover anything.</p>
    </header>

    <main>
        <form id="chatForm">
            <input
                id="question"
                name="question"
                type="text"
                placeholder="Ask MRG AI anything..."
                autocomplete="off"
                required
            >
            <button class="ask" id="askButton" type="submit">
                ✨ Ask MRG AI
            </button>
        </form>

        <div class="tools">
            <button class="tool" id="micButton" type="button">
                🎤 Speak a question
            </button>
            <button class="tool" id="voiceButton" type="button">
                🔊 Voice replies: OFF
            </button>
            <button class="tool" id="stopButton" type="button">
                ⏹ Stop speaking
            </button>
        </div>

        <div id="status" role="status" aria-live="polite">
            Ready to help!
        </div>

        <section class="card question-card" id="questionCard" hidden>
            <div class="label">YOUR QUESTION</div>
            <div id="questionText"></div>
        </section>

        <section class="card" id="answerCard" hidden>
            <div class="answer-title">🤖 MRG AI</div>
            <div id="answer" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        Powered by MRG AI · Created by <strong>Manju R Gowda</strong>
    </footer>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("question");
        const askButton = document.getElementById("askButton");
        const micButton = document.getElementById("micButton");
        const voiceButton = document.getElementById("voiceButton");
        const stopButton = document.getElementById("stopButton");
        const statusBox = document.getElementById("status");
        const questionCard = document.getElementById("questionCard");
        const questionText = document.getElementById("questionText");
        const answerCard = document.getElementById("answerCard");
        const answerBox = document.getElementById("answer");

        let voiceReplies = false;
        let recognition = null;

        function setStatus(message) {
            statusBox.textContent = message;
        }

        function speakAnswer(text) {
            if (!voiceReplies || !("speechSynthesis" in window)) return;

            window.speechSynthesis.cancel();

            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-IN";
            speech.rate = 1;
            window.speechSynthesis.speak(speech);
        }

        voiceButton.addEventListener("click", () => {
            voiceReplies = !voiceReplies;
            voiceButton.textContent = voiceReplies
                ? "🔊 Voice replies: ON"
                : "🔊 Voice replies: OFF";

            voiceButton.classList.toggle("active", voiceReplies);

            if (!voiceReplies && "speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }

            setStatus(voiceReplies
                ? "Voice replies enabled."
                : "Voice replies disabled.");
        });

        stopButton.addEventListener("click", () => {
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }
            setStatus("Stopped speaking.");
        });

        const SpeechRecognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = "en-IN";
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                micButton.classList.add("active");
                setStatus("Listening... Please speak your question.");
            };

            recognition.onresult = (event) => {
                input.value = event.results[0][0].transcript;
                setStatus("Question captured. Sending it to MRG AI...");
                form.requestSubmit();
            };

            recognition.onerror = (event) => {
                setStatus("Microphone error: " + event.error +
                    ". Check your browser's microphone permission.");
            };

            recognition.onend = () => {
                micButton.classList.remove("active");
            };

            micButton.addEventListener("click", () => {
                try {
                    recognition.start();
                } catch (error) {
                    setStatus("Please wait a moment and try the microphone again.");
                }
            });
        } else {
            micButton.addEventListener("click", () => {
                setStatus(
                    "Voice input is not supported by this browser. " +
                    "Try the latest version of Chrome."
                );
            });
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const question = input.value.trim();
            if (!question) return;

            questionCard.hidden = false;
            answerCard.hidden = false;
            questionText.textContent = question;
            answerBox.textContent = "";
            askButton.disabled = true;
            setStatus("MRG AI is thinking...");

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
                    },
                    body: new URLSearchParams({ question })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || "Request failed.");
                }

                if (!response.body) {
                    throw new Error("Your browser could not receive the answer.");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullAnswer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    fullAnswer += decoder.decode(value, { stream: true });
                    answerBox.textContent = fullAnswer;
                }

                fullAnswer += decoder.decode();
                answerBox.textContent = fullAnswer;

                if (fullAnswer.trim()) {
                    setStatus("Answer complete.");
                    speakAnswer(fullAnswer);
                } else {
                    setStatus("No answer received. Please try again.");
                }
            } catch (error) {
                answerBox.textContent =
                    "Sorry, something went wrong. " +
                    "Please try again. " + error.message;
                setStatus("Could not get an answer.");
            } finally {
                askButton.disabled = false;
            }
        });
    </script>
</body>
</html>
